name: CI

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint with ruff
        run: ruff check .

      # Two branches each adding a migration off the same parent merge cleanly
      # in git but leave alembic with two heads, which aborts app startup
      # (main.py runs `upgrade heads` in-process). Catch it here instead.
      - name: Check for single alembic head
        run: |
          HEADS=$(python -m alembic heads | wc -l)
          if [ "$HEADS" -ne 1 ]; then
            echo "Expected exactly 1 alembic head, found $HEADS:"
            python -m alembic heads
            exit 1
          fi

      - name: Run tests
        run: pytest -v

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build